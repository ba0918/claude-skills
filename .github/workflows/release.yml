name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリース version (X.Y.Z、v なし)"
        required: true

concurrency:
  group: release

permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install OpenCode for strict runtime checks
        run: npm install --global opencode-ai

      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must match X.Y.Z: $VERSION" >&2
            exit 1
          fi

      - name: Verify Unreleased entries map to merged PRs with passing checks
        # 品質ゲートの通過保証は「Unreleased の各エントリが参照する PR が
        # merged + 必須 check 済み」の機械確認で提供する（#308）。人間の宣誓
        # （semantic_reviewed checkbox）は廃止。PR 参照の無いエントリは
        # `none — 理由` 形式の明示免除を要求し、黙ってスキップされない。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_pr_check.py CHANGELOG.md > "$RUNNER_TEMP/prs.txt" || exit 1
          while read -r pr; do
            state="$(gh pr view "$pr" --json state -q .state)"
            if [ "$state" != "MERGED" ]; then
              echo "PR #$pr は MERGED でない（state=$state）。Unreleased エントリが参照する PR はマージ済みでなければならない" >&2
              exit 1
            fi
            rollup="$(gh pr view "$pr" --json statusCheckRollup -q .statusCheckRollup)"
            ROLLUP="$rollup" python3 -c 'import json,os,sys; sys.path.insert(0,"scripts"); import release_pr_check as rpc; sys.exit(0 if rpc.checks_pass(json.loads(os.environ["ROLLUP"])) else 1)'
            if [ $? -ne 0 ]; then
              echo "PR #$pr に未完了または失敗した check がある" >&2
              exit 1
            fi
            echo "PR #$pr: merged + checks 済み"
          done < "$RUNNER_TEMP/prs.txt"

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize release version
        id: sync
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sync_result="$(python3 scripts/release_tool.py sync --version "$VERSION")"
          echo "$sync_result"
          changed="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["changed"]).lower())' <<< "$sync_result")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "true" ]; then
            git add -A
            git commit \
              -m "release: v$VERSION" \
              -m "リリーストレイン方式: Unreleased を $VERSION へ確定し 4 manifest を同期"
          fi

      - name: Run strict quality gates
        env:
          STRICT_GATES: "1"
        run: sh scripts/run_checks.sh

      - name: Build release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          python3 scripts/release_tool.py notes --version "$VERSION" > "$notes_file"
          printf '%s\n' \
            '' \
            '### Install' \
            '- Claude Code: `claude plugin marketplace add ba0918/claude-skills && claude plugin install claude-skills@claude-skills`' \
            '- Codex CLI: `codex plugin marketplace add ba0918/claude-skills && codex plugin add claude-skills@claude-skills`' \
            "- OpenCode: \`\"plugin\": [\"claude-skills@git+https://github.com/ba0918/claude-skills.git#v$VERSION\"]\`" \
            >> "$notes_file"

      # 公開フェーズは scripts/release_publish.sh に集約する（失敗経路は
      # scripts/test_release_publish.py で検証）。draft Release を asset 込みで
      # 完成させてから atomic push し、最後に publish する。公開系の失敗窓は
      # publish の API 1 呼び出しに縮まり、そこで落ちても再実行で回復する。
      - name: Publish tag and release (draft-first)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          sh scripts/release_publish.sh "$VERSION" "$RUNNER_TEMP/release-notes.md"
